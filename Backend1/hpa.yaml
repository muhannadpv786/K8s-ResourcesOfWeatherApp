apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: getweatherservice
  namespace: backend-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: getweatherservice
  minReplicas: 20
  maxReplicas: 40
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60

