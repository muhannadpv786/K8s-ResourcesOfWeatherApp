apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: envfordbope-service
  namespace: backend-services
spec:
  refreshInterval: 1s
  secretStoreRef:
    name: secretstore-sample
    kind: ClusterSecretStore
  target:
    name: envfordbope-service
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: backend/dbope-service
