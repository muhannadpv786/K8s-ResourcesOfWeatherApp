apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dbope-service
  namespace: backend-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dbope-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60

