apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: weatherapp-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 650089658128.dkr.ecr.ap-south-1.amazonaws.com/frontend:36
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

